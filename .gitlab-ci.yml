stages:
  - test
  - build
  - pdf
  
variables:
  GIT_DEPTH: "0"

default:
  before_script:
    # The runner only sets safe.directory in the get_sources helper container;
    # the sphinx build runs in a different image/HOME, so git still rejects the
    # checkout as dubious ownership. Setting it here (build container) fixes the
    # "last updated by Git" step, which is fatal under -W.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

.run_on_dockerhost: &run_on_dockerhost
  tags:
    - docker20
  image: "${DOCKER_ACCESS_URL}/other/dockerdev/documentation:latest"

linkcheck:
  <<: *run_on_dockerhost
  stage: test
  script:
    - python3 -msphinx -W -b linkcheck . _build/linkcheck --keep-going
  allow_failure: true

# Every branch gets its own parallel Pages deployment at:
#   <CI_PAGES_URL>/<branch-slug>/
build_and_staging:
  <<: *run_on_dockerhost
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "master"
      when: on_success
    - when: never
  # The "pages" keyword - not the job name - is what makes this a Pages job
  # (GitLab 17.9+). Keep it, or staging stops publishing.
  pages:
    path_prefix: "$CI_COMMIT_REF_SLUG"
    # Doc branches can stay open for months. Every push to the branch
    # republishes and resets this clock, so only branches that go quiet for a
    # full quarter expire - and re-running this job republishes them at the
    # same URL.
    expire_in: 3 months
  environment:
    name: docs-staging/$CI_COMMIT_REF_SLUG
    url: $CI_PAGES_URL
  script:
    - python3 -msphinx -b html . _build/html
    # Pages publishes the "public" directory at the repository root
    - rm -rf public
    - mv _build/html public
    - echo "Staging documentation published to ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public

build_and_install:
  <<: *run_on_dockerhost
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - python3 -msphinx -W -b html . _build/html
    - python3 -msphinx.ext.intersphinx _build/html/objects.inv > _build/html/help_index_user_guide.txt
    - cp -r _build/html user-guide
    - az storage copy -s 'user-guide' --recursive --destination-container '$web' -- --overwrite=true --as-subdir=true
    - bash load_ssh_key_for_deploy.sh
    - rsync -rt --delete-excluded _build/html/ support@data.aimms.com:/home/aimms/www/documentation.aimms.com/user-guide

compile_PDF:
  <<: *run_on_dockerhost
  stage: pdf
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - python3 -msphinx -M latex . _build
    - python3 -msphinx -M latexpdf . _build
    - mkdir -p user-guide && cp _build/latex/AIMMS_user.pdf user-guide/AIMMS_user.pdf
    - az storage copy -s 'user-guide' --recursive --destination-container '$web' -- --overwrite=true --as-subdir=true
    - bash load_ssh_key_for_deploy.sh
    - rsync -rt _build/latex/AIMMS_user.pdf support@data.aimms.com:/home/aimms/www/documentation.aimms.com/user-guide
    - rsync -rt _build/latex/AIMMS_user.pdf support@data.aimms.com:/home/aimms/www/data/download/manuals
  allow_failure: true
