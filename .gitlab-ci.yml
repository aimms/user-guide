stages:
  - test
  - build
  - deploy
  
variables:
  GIT_DEPTH: "0"

default:
  before_script:
    # The runner only sets safe.directory in the get_sources helper container;
    # the sphinx build runs in a different image/HOME, so git still rejects the
    # checkout as dubious ownership. Setting it here (build container) fixes the
    # "last updated by Git" step, which is fatal under -W.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

.run_on_dockerhost: &run_on_dockerhost
  tags:
    - docker20
  image: "${DOCKER_ACCESS_URL}/other/dockerdev/documentation:latest"

# Two linkcheck runs, the same pair every AIMMS docs repo has: the gating one
# checks only links internal to this project, the informational one also checks
# external links and is allowed to fail. Splitting them is what keeps a rotted
# or bot-blocked third-party URL from turning the pipeline red.
linkcheck:
  <<: *run_on_dockerhost
  stage: test
  variables:
    SPHINX_IGNORE_EXTERNAL_LINKS: "true"
  script:
    - sphinx-build -W --keep-going -b linkcheck . _build/linkcheck

linkcheck_external:
  <<: *run_on_dockerhost
  stage: test
  script:
    - sphinx-build -W --keep-going -b linkcheck . _build/linkcheck
  allow_failure: true

build:
  <<: *run_on_dockerhost
  stage: test
  script:
    - sphinx-build -W --keep-going -b html . _build/html

# Informational for now, unlike the gating spellcheck in documentation and
# how-to. A run over this repo flags words in 1281 files - the largest backlog of
# the set. Much of it is vocabulary the wordlist simply lacks (tooltip, profiler,
# breakpoint), but there are real typos in there too ("whem" for "when",
# "misformulations"). Feed the vocabulary into spelling_wordlist.txt and fix the
# typos, then drop allow_failure so this gates like the other repos.
spellcheck:
  <<: *run_on_dockerhost
  stage: test
  script:
    - sphinx-build -W --keep-going -b spelling . _build/spelling
  allow_failure: true

# Every branch gets its own parallel Pages deployment at:
#   <CI_PAGES_URL>/<branch-slug>/
build_staging:
  <<: *run_on_dockerhost
  stage: build
  # Depend on the three gating checks by name rather than on the whole test
  # stage. Stage ordering alone would also make linkcheck_external a
  # prerequisite: it is allow_failure so it can never fail the pipeline, but the
  # stage would still wait for it to finish, and checking every external URL is
  # by far the slowest job here. spellcheck is listed even where it is
  # allow_failure - a needed job that fails but is allowed to does not block.
  needs:
    - job: build
    - job: linkcheck
    - job: spellcheck
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "master"
      when: on_success
    - when: never
  # The "pages" keyword - not the job name - is what makes this a Pages job
  # (GitLab 17.9+). Keep it, or staging stops publishing.
  pages:
    path_prefix: "$CI_COMMIT_REF_SLUG"
    # Doc branches can stay open for months. Every push to the branch
    # republishes and resets this clock, so only branches that go quiet for a
    # full quarter expire - and re-running this job republishes them at the
    # same URL.
    expire_in: 3 months
  environment:
    name: docs-staging/$CI_COMMIT_REF_SLUG
    url: $CI_PAGES_URL
  script:
    - sphinx-build -b html . _build/html
    # Pages publishes the "public" directory at the repository root
    - rm -rf public
    - mv _build/html public
    - echo "Staging documentation published to ${CI_PAGES_URL}"
  artifacts:
    paths:
      - public

deploy:
  <<: *run_on_dockerhost
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - sphinx-build -W --keep-going -b html . _build/html
    - python3 -msphinx.ext.intersphinx _build/html/objects.inv > _build/html/help_index_user_guide.txt
    - cp -r _build/html user-guide
    - az storage copy -s 'user-guide' --recursive --destination-container '$web' -- --overwrite=true --as-subdir=true
    - bash load_ssh_key_for_deploy.sh
    - rsync -rt --delete-excluded _build/html/ support@data.aimms.com:/home/aimms/www/documentation.aimms.com/user-guide

compile_PDF:
  <<: *run_on_dockerhost
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
    - when: never
  script:
    - sphinx-build -M latex . _build
    - sphinx-build -M latexpdf . _build
    - mkdir -p user-guide && cp _build/latex/AIMMS_user.pdf user-guide/AIMMS_user.pdf
    - az storage copy -s 'user-guide' --recursive --destination-container '$web' -- --overwrite=true --as-subdir=true
    - bash load_ssh_key_for_deploy.sh
    - rsync -rt _build/latex/AIMMS_user.pdf support@data.aimms.com:/home/aimms/www/documentation.aimms.com/user-guide
    - rsync -rt _build/latex/AIMMS_user.pdf support@data.aimms.com:/home/aimms/www/data/download/manuals
  allow_failure: true
